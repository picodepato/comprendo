<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMPRENDO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning, a little adventurous, made for curious kids and teens
   IDEA a night-time library of 15 worlds: each topic is a lit doorway with its own colour and picture
   PICTURE one illustrated scene per topic (cards on the home page, wide band on each reading)
   COLOUR night plum ground, bone-white ink, one accent per topic, mint for correct answers
   TYPE Bungee display + Lexend (made for easy reading)
   LAYOUT sticky bar; level picker; card grid; reading in one calm column with exercises below.
   CONTENT lives in content/: catalogo.json (languages, topics, levels), textos-web.json (buttons),
   <lang>/lecturas/*.json (readings), <lang>/definiciones.json, <lang>/traducciones-<lang>.json */
:root{color-scheme:dark;--bg:#120e16;--panel:#1c1622;--panel2:#272030;--line:#3a3044;--ink:#f4eee6;--mute:#b9aec4;--red:#ff4141;--acc:#ff4141;--ok:#3fd69c;--beam:#fff1c9}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.6 Lexend,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px max(4vw,16px);background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.brand{font-family:Bungee,Impact,sans-serif;font-size:18px;letter-spacing:.01em;color:var(--acc);white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tabs a{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);color:var(--mute);text-decoration:none;font-weight:500;font-size:15px;white-space:nowrap}
.tabs a[aria-current=page]{background:var(--acc);border-color:var(--acc);color:#1a0a0a}
.score{font-weight:700;font-size:15px;white-space:nowrap;padding:6px 12px;border-radius:10px;background:var(--panel2)}
.score b{color:var(--ok)}
.hero{position:relative;height:clamp(190px,32vw,330px);background:#0b0810;overflow:hidden}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.glow{animation:pulse 3.2s ease-in-out infinite;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.glow{animation:none}}
.wrap{max-width:760px;margin:0 auto;padding:24px max(4vw,16px) 64px}
h1{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1.05;margin:0;text-wrap:balance}
.en{color:var(--mute);font-size:15px;margin:4px 0 0}
.howto{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:20px 0 14px;padding:12px 14px;border-radius:12px;background:var(--panel2);font-size:15px}
.howto p{margin:0;flex:1 1 260px}
.howto .en{margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500;font-size:15px}
.btn:hover{border-color:var(--mute)}
.btn:focus-visible,.opt:focus-visible,.mi:focus-visible,.tabs a:focus-visible{outline:3px solid var(--hi,var(--beam));outline-offset:2px}
.btn.main{background:var(--acc);border-color:var(--acc);color:#1a0a0a}
.check{display:inline-flex;align-items:center;gap:8px;font-size:15px;min-height:44px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--acc)}
.reading{font-size:19px;line-height:1.85;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,30px)}
.reading p{margin:0 0 1em}
.reading p:last-child{margin:0}
.w{cursor:pointer;border-radius:5px;padding:1px 1px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.reading .w{border-bottom:1px dotted rgba(244,238,230,.25)}
.w:hover{background:rgba(255,241,201,.12)}
.w.on{background:var(--beam);color:#1a1208}
.tip{position:fixed;z-index:50;left:0;top:0;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .1s,transform .1s;background:var(--beam);color:#1a1208;border-radius:12px;padding:8px 14px 9px;max-width:min(320px,92vw);box-shadow:0 8px 24px rgba(0,0,0,.45);text-align:center}
.tip.show{opacity:1;transform:none;pointer-events:auto}
.tip .add{display:block;width:100%;margin-top:8px;min-height:40px;padding:6px 12px;border-radius:9px;border:0;background:#1a1208;color:var(--hi,var(--beam));font-weight:700;font-size:14px;cursor:pointer}
.tip .add[disabled]{background:rgba(26,18,8,.12);color:#14583f;cursor:default}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:15px}
.seg button[aria-pressed=true]{background:var(--beam);color:#1a1208;border-color:var(--beam);font-weight:700}
.remix{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,var(--panel)),var(--panel) 70%);border:1px solid color-mix(in srgb,var(--acc) 50%,transparent);border-radius:16px;padding:18px;margin-top:16px}
.remix h2{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:28px;margin:0;color:var(--acc)}
.remix p{margin:4px 0 0}
.remix>div{flex:1 1 260px}
.btn[disabled]{opacity:.45;cursor:default}
.dh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.words{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.words li{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 12px;line-height:1.3}
.words li.miss{border-color:var(--acc)}
.words li div{flex:1}
.words li b{display:block}
.words li span{color:var(--mute);font-size:14px}
.words li em{font-style:normal;font-size:12px;font-weight:700;color:#1a0a0a;background:var(--acc);border-radius:6px;padding:1px 6px;margin-left:6px}
.x{flex:none;width:40px;height:40px;border:0;background:transparent;color:var(--mute);font-size:22px;cursor:pointer;border-radius:8px}
.x:hover{background:var(--panel2);color:var(--ink)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:14px 16px;margin:12px 0 0;font-size:15px}
.empty a{color:var(--hi,var(--beam))}
.qc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,4vw,26px);margin-top:18px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--mute)}
.prog{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:10px 0 18px}
.prog i{display:block;height:100%;background:var(--acc)}
.prompt{font-size:clamp(22px,5vw,30px);font-weight:700;line-height:1.25;margin:0}
.prompt em{font-style:normal;color:var(--hi,var(--beam))}
.tip small{display:block;font-size:13px;opacity:.7;line-height:1.2}
.tip b{display:block;font-size:20px;line-height:1.25}
.tip::after{content:"";position:absolute;left:var(--ax,50%);bottom:-7px;width:14px;height:14px;margin-left:-7px;background:var(--beam);transform:rotate(45deg)}
.tip.below::after{bottom:auto;top:-7px}
.ex{margin-top:40px}
.ex h2{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:24px;line-height:1.15;margin:0;color:var(--ink)}
.ex h2 span{color:var(--acc)}
.ex>.en{margin-bottom:16px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.q .stem{font-weight:500;font-size:18px;margin:0 0 10px}
.q .stem i{font-style:normal;color:var(--mute);font-weight:400;font-size:15px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:17px}
.opt .k{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--bg);font-weight:700;font-size:14px}
.opt:hover:not([disabled]){border-color:var(--mute)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:rgba(63,214,156,.16)}
.opt.right .k{background:var(--ok);color:#06231a}
.opt.wrong{border-color:var(--acc);background:rgba(255,65,65,.14)}
.opt.wrong .k{background:var(--acc);color:#1a0a0a}
.opt.dim{opacity:.55}
.fb{margin:10px 0 0;font-size:15px;font-weight:500}
.fb.ok{color:var(--ok)}
.fb.no{color:#ff8a8a}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--mute);text-align:center;color:var(--ok);font-weight:700;line-height:1.3}
.reading.num{counter-reset:par}
.reading.num p{position:relative;counter-increment:par;padding-left:30px}
.reading.num p::before{content:counter(par);position:absolute;left:0;top:.35em;display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--panel2);color:var(--mute);font-size:12px;font-weight:700;line-height:1}
.opts.pr{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
.opts.pr .opt{white-space:nowrap}
.uoe{margin:0 0 22px}
.uoe h3{margin:18px 0 4px;font-size:18px}
.uoe .uh{margin:0 0 10px;font-size:15px;color:var(--mute)}
.uoe-text{font-size:18px;line-height:2.1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.uoe-text .gn{font-size:12px;font-weight:700;color:var(--mute);margin-right:2px;vertical-align:1px}
.uoe-text .root{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--hi,var(--beam));margin-left:3px}
.gin{font:inherit;font-size:17px;width:8.5em;max-width:60vw;padding:1px 6px;border:0;border-bottom:2px solid var(--mute);border-radius:6px 6px 0 0;background:var(--panel2);color:var(--ink)}
.gin:focus{outline:2px solid var(--hi,var(--beam));outline-offset:1px}
.gin.long{width:min(16em,100%)}
.gdone{font-weight:700;color:var(--ok);border-bottom:2px solid var(--ok);padding:0 3px}
.gdone.bad s{color:#ff8a8a;font-weight:500}
.gdone.bad{color:var(--ok);border-color:#ff8a8a}
.uoe-mc .q{padding:10px 12px;margin-bottom:8px}
.uoe-mc .stem{font-size:15px;margin-bottom:6px}
.uoe-mc .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
.uoe-mc .opt{min-height:42px;font-size:16px;padding:6px 10px}
.kwt .kw{display:inline-block;margin:4px 0 8px;padding:2px 10px;border-radius:8px;background:var(--panel2);font-weight:700;letter-spacing:.06em;color:var(--hi,var(--beam))}
.kwt .ks{margin:0 0 10px;line-height:2}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.col{display:grid;gap:8px;align-content:start}
.col h3{margin:0 0 2px;font-size:13px;font-weight:500;color:var(--mute)}
.mi{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;text-align:left;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:16px;line-height:1.35}
.mi:hover:not([disabled]){border-color:var(--mute)}
.mi.sel{border-color:var(--beam);box-shadow:0 0 0 2px var(--beam) inset}
.mi.done{border-color:var(--ok);background:rgba(63,214,156,.14);cursor:default}
.mi .n{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--ok);color:#06231a;font-size:13px;font-weight:700}
.mi.bad{border-color:var(--acc);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mnote{font-size:14px;color:var(--mute);margin:8px 2px 0}
.rule{background:var(--panel2);border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:16px}
.rule p{margin:0 0 8px}
.rule table{border-collapse:collapse;width:100%;font-size:15px}
.rule td{padding:5px 8px;border-top:1px solid var(--line);vertical-align:top}
.rule td:first-child{font-weight:700;color:var(--hi,var(--beam));white-space:nowrap}
.rule td:last-child{color:var(--mute)}
.res{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.big{font-family:Bungee,Impact,sans-serif;font-size:clamp(40px,10vw,64px);line-height:1;margin:4px 0 6px}
.big small{font-size:.45em;color:var(--mute)}
.bars{display:grid;gap:10px;margin:16px 0}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:15px}
.bar .t{height:10px;grid-column:1/-1;background:var(--panel2);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--ok);border-radius:6px}
.bar b{white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
@media(max-width:600px){
 body{font-size:16px}
 .reading{font-size:18px}
 .brand{font-size:15px}
 .tabs a{padding:6px 10px;font-size:14px}
 .match{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:10px}
 .mi{font-size:15px;padding:8px 10px}
}
.opt.wrong{border-color:var(--red);background:rgba(255,65,65,.14)}.opt.wrong .k{background:var(--red);color:#1a0a0a}.mi.bad{border-color:var(--red)}.words li.miss{border-color:rgba(255,65,65,.65)}.words li em{background:var(--red)}
.brand{text-decoration:none;color:var(--acc)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tip p.def{margin:6px 0 0;font-size:14px;line-height:1.35;text-align:left;border-top:1px solid rgba(26,18,8,.18);padding-top:6px}
.tip p.def i{font-style:normal;font-weight:700}
.intro{position:relative;padding:clamp(28px,5vw,56px) max(4vw,16px) 26px;background:radial-gradient(120% 140% at 85% 0%,var(--intro,#2a1730) 0%,var(--bg) 60%);border-bottom:1px solid var(--line)}
.intro .in{max-width:1180px;margin:0 auto}
.intro h1{font-size:clamp(34px,7vw,60px);color:var(--acc)}
.intro .lead{font-size:18px;margin:8px 0 0;max-width:60ch}
.pickers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:22px}
.pk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pk h2{margin:0 0 8px;font-size:15px;font-weight:700}
.pk h2 .en{display:inline;margin-left:6px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:44px;padding:4px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:15px;line-height:1.2}
.chip small{font-size:11.5px;color:var(--mute)}
.chip[aria-pressed=true]{background:var(--beam);border-color:var(--beam);color:#1a1208;font-weight:700}
.chip[aria-pressed=true] small{color:#5a4a2a}
.chip[disabled]{opacity:.5;cursor:default}
.lvbar{max-width:1180px;margin:0 auto;padding:22px max(4vw,16px) 0;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.lvbar h2{margin:0;font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:22px}
.lv{display:flex;flex-wrap:wrap;gap:8px}
.lv a{display:flex;flex-direction:column;min-height:48px;justify-content:center;padding:4px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;line-height:1.15}
.lv a b{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:20px}
.lv a span{font-size:13px;color:var(--mute)}
.lv a[aria-current=true]{background:var(--beam);border-color:var(--beam);color:#1a1208}
.lv a[aria-current=true] span{color:#5a4a2a}
.grid{max-width:1180px;margin:0 auto;padding:18px max(4vw,16px) 64px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.card{--c:#fff;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;color:var(--ink);text-decoration:none;transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-3px);border-color:var(--c)}
a.card:focus-visible{outline:3px solid var(--hi,var(--beam));outline-offset:2px}
.card .art{position:relative;aspect-ratio:2/1;background:#120e16}
.card .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .tx{padding:10px 14px 14px;display:grid;gap:2px}
.card .tn{font-size:13px;font-weight:700;color:var(--c)}
.card .tt{font-size:17px;font-weight:500;line-height:1.3}
.card .te{font-size:13.5px;color:var(--mute)}
.card .badge{position:absolute;left:10px;top:10px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--c);color:#120e16}
.card.lock{opacity:.62}
.card.lock .badge{background:#120e16cc;color:var(--ink);border:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){.card{transition:none}a.card:hover{transform:none}}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px;font-size:14px;font-weight:700}
.meta span{padding:2px 9px;border-radius:7px;background:var(--acc);color:#120e16}
.meta a{color:var(--mute);font-weight:500}
.next{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px;margin-top:12px}
.next .card .tt{font-size:16px}
.ex h3{font-size:16px;margin:22px 0 0}
.ex h3 .en{display:inline;margin-left:6px;font-weight:400}
.msg{padding:60px 20px;text-align:center;color:var(--mute)}
[hidden]{display:none!important}
/* diccionario: modos de repaso */
.words li span.tro,.words li span.dd{display:block;font-size:13px}
.words li span.tro abbr{text-decoration:none;font-weight:700;font-size:11px;color:var(--ink);background:var(--panel2);border-radius:5px;padding:0 5px;margin-right:4px}
.words li span.dd{color:var(--mute);opacity:.85;margin-top:2px}
.gs{font-size:clamp(19px,4.4vw,24px);line-height:1.5;margin:0}
.gs .blank{min-width:3em;padding:0 4px;color:var(--hi,var(--beam));letter-spacing:.12em}
.gs .blank.bad{color:#ff8a8a;letter-spacing:0}
.rxw{margin-top:10px}
.qw{display:flex;flex-wrap:wrap;gap:8px}
.qw input{flex:1 1 220px;min-height:48px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:18px}
.qw input:focus{outline:3px solid var(--hi,var(--beam));outline-offset:1px}
.qw input[disabled]{opacity:.8}
.xpn{display:inline-block;font-weight:700;color:#1a1208;background:var(--beam);border-radius:7px;padding:1px 8px;font-size:14px;margin:6px 0 0}
@media(max-width:600px){.tk{display:none}.tabs{flex:1 1 auto}.top{gap:8px 10px}}
/* points, streak, stickers, medals */
.me{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;white-space:nowrap}
.me[aria-current=page]{border-color:var(--beam)}
.me:focus-visible{outline:3px solid var(--hi,var(--beam));outline-offset:2px}
.me .lvn{color:var(--hi,var(--beam))}
.fire.off{filter:grayscale(1);opacity:.55}
.toasts{position:fixed;z-index:60;left:50%;bottom:18px;transform:translateX(-50%);display:grid;gap:8px;justify-items:center;pointer-events:none;width:min(92vw,440px)}
.toast{background:var(--beam);color:#1a1208;font-weight:700;font-size:15px;border-radius:12px;padding:9px 16px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tin .25s ease-out;text-align:center}
.toast.tbig{background:var(--ok);color:#06231a;font-size:17px;padding:12px 18px}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.96)}}
.wrap.wide{max-width:1000px}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px;margin-top:20px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.box h2{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--mute)}
.lvl{font-family:Bungee,Impact,sans-serif;font-size:46px;line-height:1.05;margin:2px 0}
.rank{margin:0;font-weight:700;color:var(--hi,var(--beam))}
.xpb{height:12px;background:var(--panel2);border-radius:8px;overflow:hidden;margin:12px 0 6px}
.xpb i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#a6f5d6);border-radius:8px}
.small{font-size:14px;color:var(--mute);margin:0;line-height:1.45}
.shields{display:flex;gap:8px;margin:8px 0 10px}
.sh{width:42px;height:48px;display:grid;place-items:center;border-radius:12px;border:2px dashed var(--line);font-size:24px}
.sh.on{border:2px solid #7fb7ff;background:rgba(127,183,255,.15)}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:10px;margin-top:14px}
.md{display:grid;justify-items:center;align-content:start;text-align:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 10px}
.md .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--panel2);border:4px solid var(--line)}
.md.t1 .ic{border-color:#cd7f32;background:rgba(205,127,50,.2)}
.md.t2 .ic{border-color:#dfe3ea;background:rgba(223,227,234,.16)}
.md.t3 .ic{border-color:#ffd54a;background:rgba(255,213,74,.2);box-shadow:0 0 18px rgba(255,213,74,.35)}
.md.lock .ic{filter:grayscale(1);opacity:.5}
.md b{font-size:15px;line-height:1.25}
.md span{font-size:13px;color:var(--mute);line-height:1.3}
.md .pb{width:100%;height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:2px}
.md .pb i{display:block;height:100%;background:var(--ok)}
.alb{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px 14px;margin-top:6px}
.at{display:grid;gap:6px}
.at h3{margin:0;font-size:14px;color:var(--c)}
.at.full h3::after{content:" ★";color:#ffd54a}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stk{position:relative;display:block;aspect-ratio:4/5;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#0b0810;color:var(--ink);text-decoration:none}
.stk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stk.got{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 35%,transparent)}
.stk:not(.got) img{filter:grayscale(1) brightness(.3) blur(1.5px)}
.stk.soon{opacity:.6}
.stk .lv1{position:absolute;left:6px;top:6px;font-size:11.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--c);color:#120e16}
.stk:not(.got) .lv1{background:#120e16cc;color:var(--ink);border:1px solid var(--line)}
.stk .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 7px 6px;background:linear-gradient(transparent,#000d);font-size:12px;line-height:1.2;font-weight:500}
.stk .qm{position:absolute;inset:0;display:grid;place-items:center;font-family:Bungee,Impact,sans-serif;font-size:32px;color:var(--mute)}
a.stk:focus-visible{outline:3px solid var(--hi,var(--beam));outline-offset:2px}
.won{display:flex;align-items:center;gap:14px;margin-top:14px;padding:12px;border-radius:12px;background:var(--panel2)}
.won .stk{width:76px;flex:none}
.won p{margin:0}
@media(prefers-reduced-motion:reduce){.toast{animation:none}}
@media(max-width:600px){.me{padding:6px 9px;font-size:14px}}
/* stars per reading */
.stars{display:inline-flex;gap:1px;line-height:1;vertical-align:-1px}
.stars i{font-style:normal;color:#5a4f63}
.stars i.on{color:#ffd54a;text-shadow:0 0 6px rgba(255,213,74,.45)}
.stars.big{font-size:38px;gap:4px}
.card .rs{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px;color:var(--mute)}
.card .rs .stars{font-size:17px}
.stk .st3{position:absolute;right:5px;top:5px;font-size:11px;background:#120e16cc;border-radius:6px;padding:2px 4px}
.runstars{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:var(--panel2)}
.runstars p{margin:0}
.meta .stars{font-size:16px}
.meta .rt{color:var(--mute);font-weight:500}
/* fitxa questions (open, true/false), translation, source */
.fx textarea{display:block;width:100%;box-sizing:border-box;min-height:76px;margin:0 0 4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;font-size:17px;line-height:1.45;resize:vertical}
.fx .mine{background:var(--panel2);border-radius:10px;padding:8px 12px;margin:0;font-size:16px;white-space:pre-wrap}
.fx .mine.bad{border-left:3px solid var(--red)}
.fx .model{border-left:3px solid var(--ok);padding:4px 12px;margin:10px 0 0;font-size:16px}
.fx .ev,.vf .ev{display:block;font-size:14px;color:var(--mute);margin:8px 0 0;line-height:1.45}
.fxj{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.vf{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:17px}
.vf .seg{flex:none;display:flex;gap:6px}.vf .seg button{min-width:48px;font-weight:700}
.vf.right .seg button[aria-pressed="true"]{border-color:var(--ok);background:rgba(63,214,156,.25);color:var(--ink)}
.vf.wrong .seg button[aria-pressed="true"]{border-color:var(--red);background:rgba(255,65,65,.25);color:var(--ink)}
.trx{display:block;color:var(--mute);font-size:15px;line-height:1.55;font-style:italic;margin:4px 0 10px}
.reading .trx{font-size:16px;margin:-.6em 0 1.2em;padding-left:30px}
.reading:not(.num) .trx{padding-left:0}
.trbtn{margin:0 0 12px}.trbtn .btn[aria-pressed="true"]{border-color:var(--ok)}
.src{font-size:14px;color:var(--mute);margin:10px 0 0;line-height:1.5}
@media(max-width:560px){.rule td:first-child{white-space:normal}}

  else if (act === "remix") startQuiz(shuf(mine().filter(([d]) => S.rxall || d.miss).map(([, i]) => i)).slice(0, RXMAX), "Remix");
  else if (act === "again") startQuiz([...new Set(Q.fails)], U("retry_fails", S.learn));
  else if (act === "quit") { Q = null; render(); scrollTo(0, 0); }
  else if (act === "qa") {
    if (!Q || Q.pick !== null) return true; Q.pick = +b.dataset.o;
    const d = S.dict[Q.items[Q.i]], opts = Q.modes[Q.i] === "fill" ? Q.fopts : Q.opts[Q.i], right = Q.modes[Q.i] === "fill" ? d.w : Q.dirs[Q.i] === "learn" ? trOf(d) : d.w;
    answer(opts[Q.pick] === right, "choice");
  } else if (act === "qcheck") {
    if (!Q || Q.pick !== null) return true;
    const inp = $("qin"), typed = inp ? inp.value : ""; if (!typed.trim()) { inp?.focus(); return true; }
    const d = S.dict[Q.items[Q.i]], right = Q.modes[Q.i] === "fill" ? d.w : Q.dirs[Q.i] === "learn" ? trOf(d) : d.w;
    Q.typed = typed; Q.res = judge(typed, right); Q.pick = 0;
    answer(!!Q.res, "typed");
  } else if (act === "qhelp") {
    if (!Q || Q.pick !== null) return true;
    Q.help = true; Q.fopts = options(S.dict[Q.items[Q.i]], "know"); render();
  } else if (act === "qnext") { Q.i++; Q.pick = null; Q.typed = ""; Q.res = ""; Q.help = false; Q.got = 0; render(); }
  else if (act === "sayw") { const d = Q && S.dict[Q.items[Q.i]]; if (d && ((Q.dirs[Q.i] === "learn" && Q.modes[Q.i] !== "fill") || Q.pick !== null)) speak(d.w, 1); }
  else return false;
  return true;
}
$("app").addEventListener("submit", e => { if (e.target.closest(".qw")) { e.preventDefault(); dictAct("qcheck", e.target); } });

/* ---------- tooltip ---------- */
const tip = $("tip"), addBtn = $("add");
let cur = null, word = null, pressing = false, downAt = 0, held = 0, hideT = null, sel = null, bad = null;
const inDict = (k, r) => S.dict.some(d => d.k === k && d.r === r && d.l === S.learn);
function updAdd() { const has = word && inDict(word.k, word.r); addBtn.disabled = !!has; addBtn.textContent = has ? TI("saved") : TI("add"); }
function place(w) {
  tip.classList.remove("below"); tip.style.left = "0px"; tip.style.top = "0px";
  const r = w.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, innerWidth - tw - 8)), y = r.top - th - 12;
  if (y < 64) { y = r.bottom + 12; tip.classList.add("below"); }
  tip.style.left = x + "px"; tip.style.top = y + "px";
  tip.style.setProperty("--ax", Math.max(14, Math.min(tw - 14, r.left + r.width / 2 - x)) + "px");
}
function showTip(w) {
  const info = lookup(w.textContent, w.dataset.k); if (!info) return;
  clearTimeout(hideT); if (cur) cur.classList.remove("on");
  cur = w; w.classList.add("on");
  const isName = info.d && NAME.test(info.d[1]);
  word = {w: isName ? w.textContent : w.textContent.toLowerCase(), k: info.k, t: info.t, d: info.d ? `${info.d[0]}: ${info.d[1]}` : "", r: S.read};
  tip.querySelector("small").textContent = w.textContent;
  tip.querySelector("b").textContent = info.t;
  tip.querySelector(".def").innerHTML = info.d ? `<i>${esc(info.d[0])}</i> · ${esc(info.d[1])}` : "";
  tip.querySelector(".def").hidden = !info.d;
  updAdd(); place(w); tip.classList.add("show");
  if (S.say) speak(w.textContent, 1);
}
function hideTip(delay) { clearTimeout(hideT); hideT = setTimeout(() => { tip.classList.remove("show"); if (cur) cur.classList.remove("on"); cur = null; }, delay); }
function speak(t, short) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = CAT.languages[S.learn].voice; u.rate = short ? .8 : .85; speechSynthesis.speak(u); } catch (e) {} }
document.addEventListener("pointerdown", e => {
  if (e.target.closest("#tip")) { clearTimeout(hideT); return; }
  const w = e.target.closest(".w"); held = 0;
  if (!w) { if (cur) hideTip(0); return; }
  pressing = true; downAt = Date.now(); showTip(w);
});
const release = () => { if (!pressing) return; pressing = false; held = Date.now() - downAt; hideTip(4000); };
document.addEventListener("pointerup", release); document.addEventListener("pointercancel", release);
addEventListener("scroll", () => { if (cur && !pressing) hideTip(0); }, {passive: true});
document.addEventListener("contextmenu", e => { if (e.target.closest(".w")) e.preventDefault(); });
document.addEventListener("click", e => { if (held >= 400 && e.target.closest(".w")) { e.preventDefault(); e.stopPropagation(); held = 0; } }, true);
addBtn.addEventListener("click", () => {
  if (!word || inDict(word.k, word.r)) return;
  S.dict.push({w: word.w, k: word.k, r: word.r, l: S.learn, t: word.t, tr: {[S.know]: word.t}, d: word.d, miss: false});
  xp(1, "dict-save", {ok: true, word: word.w}); fillTr();
  save(); updAdd(); renderTop(); hideTip(1400);
});

/* ---------- actions ---------- */
$("app").addEventListener("change", e => { if (e.target.id === "say") { S.say = e.target.checked; save(); } });
$("app").addEventListener("input", e => { if (e.target.classList.contains("gin") || e.target.classList.contains("qta")) DRAFT[e.target.dataset.k] = e.target.value; });
$("app").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList.contains("gin") && R?.grammar?.parts) { e.preventDefault(); const i = +e.target.dataset.i, pi = R.grammar.parts.findIndex(p => p.items.includes(i)); if (pi >= 0) checkTyped(pi); } });
$("app").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = R?.id;
  if (await dictAct(act, b)) return;
  if (act === "know" || act === "learn") { S[act] = b.dataset.l; fixCourse(act); save(); route(); }
  else if (act === "q" || act === "g") {
    if (S.a[b.dataset.k] === undefined) {
      const o = +b.dataset.o, i = +b.dataset.k.split(":").pop().slice(1), it = act === "q" ? R.q[i] : R.grammar.items[i];
      S.a[b.dataset.k] = o; award(it && o === it[2] ? 10 : 2, "a:" + b.dataset.k, id); checkReading(R); save(); render();
    }
  }
  else if (act === "gt") checkTyped(+b.dataset.p);
  else if (act === "trx") { S.trx = !S.trx; save(); render(); }
  else if (act === "qo") {
    const i = +b.dataset.i, q = R.q[i], tk = `${id}:qt${i}`, v = (DRAFT[tk] || "").trim();
    if (!v) { toast(TI("fx_write_first")); return; }
    S.a[tk] = v.slice(0, 600); delete DRAFT[tk];
    if (keysOk(q[3], v)) { S.a[`${id}:q${i}`] = q[2]; award(10, `a:${id}:q${i}`, id); checkReading(R); } else S.a[`${id}:qs${i}`] = 1;
    save(); render();
  }
  else if (act === "qself") {
    const i = +b.dataset.i, q = R.q[i], ok = b.dataset.v === "1";
    if (S.a[`${id}:q${i}`] !== undefined) return;
    S.a[`${id}:q${i}`] = ok ? q[2] : -1; delete S.a[`${id}:qs${i}`]; award(ok ? 8 : 2, `a:${id}:q${i}`, id); checkReading(R); save(); render();
  }
  else if (act === "qj") { const jk = `${id}:qj${+b.dataset.i}`; S.a[jk] = (DRAFT[jk] || "").trim().slice(0, 600); delete DRAFT[jk]; save(); render(); }
  else if (act === "vf") { const vk = `${id}:qv${+b.dataset.i}`; if (S.a[vk]) return; (DRAFT[vk] ||= [])[+b.dataset.j] = b.dataset.v === "1"; render(); }
  else if (act === "vfc") {
    const i = +b.dataset.i, q = R.q[i], vk = `${id}:qv${i}`, dr = DRAFT[vk] || [], it = q[3].items;
    if (S.a[vk] || it.some((_, j) => typeof dr[j] !== "boolean")) return;
    S.a[vk] = it.map((_, j) => dr[j]); delete DRAFT[vk];
    const n = it.filter(([, v], j) => dr[j] === v).length;
    S.a[`${id}:q${i}`] = n === it.length ? q[2] : -1; award(n * 2, `a:${id}:q${i}`, id); checkReading(R); save(); render();
  }
  else if (act === "shield") { const g = S.g; if (g.shields < SHIELD_MAX && g.xp - g.spent >= SHIELD_COST) { g.spent += SHIELD_COST; g.shields++; save(); toast(TI("t_bought")); render(); } }
  else if (act === "m") {
    const k = b.dataset.m, side = b.dataset.side, i = +b.dataset.i, key = `${id}:${k}`;
    const m = S.a[key] || (S.a[key] = {d: [], x: []});
    if (sel && sel.k === k && sel.side !== side) {
      const l = side === "L" ? i : sel.i, r = side === "R" ? i : sel.i; sel = null;
      if (l === r) { m.d.push(l); award(5, `m:${key}:${l}`, id); } else { if (!m.x.includes(l)) m.x.push(l); bad = {k, l, r}; setTimeout(() => { bad = null; render(); }, 450); }
      checkReading(R); save();
    } else sel = (sel && sel.k === k && sel.side === side && sel.i === i) ? null : {k, side, i};
    render();
  } else if (act === "listen") { try { if (speechSynthesis.speaking) { speechSynthesis.cancel(); return; } speak(R.text.map(plain).join(" ")); } catch (err) {} }
  else if (act === "reset") { for (const k of Object.keys(S.a)) if (k.startsWith(id + ":")) delete S.a[k]; sel = null; save(); render(); scrollTo(0, 0); }
});

/* ---------- routing ---------- */
function render() {
  renderTop();
  if (S.view === "dict") return renderDict();
  if (S.view === "fc" && window.LYAFichas) return LYAFichas.render($("app"));
  if (S.view === "games" && window.LYAJuegos) return LYAJuegos.render($("app"));
  if (S.view === "prog") return renderProg();
  if (S.view === "pet" && window.LYAMascota) return LYAMascota.render($("app"));
  if (S.view === "songs" && window.LYACanciones) return LYACanciones.render($("app"));
  if (S.view === "dub" && window.LYADoblaje) return LYADoblaje.render($("app"));
  if (S.view === "dictado" && window.LYADictados) return LYADictados.render($("app"));
  if (S.view === "duelo" && window.LYADuelo) return LYADuelo.render($("app"));
  if (S.view === "escape" && window.LYAEscape) return LYAEscape.render($("app"));
  if (S.view === "retos" && window.LYARetos) return LYARetos.render($("app"));
  if (S.view === "mates" && window.LYAMates) return LYAMates.render($("app"));
  if (S.view === "fpb" && window.LYAFpb) return LYAFpb.render($("app"));
  if (S.view === "cc" && window.LYAConcursos) return LYAConcursos.render($("app"));
  if (S.view === "vd" && window.LYAVideos) return LYAVideos.render($("app"));
  if (S.view === "deb" && window.LYAAvisos?.render) return LYAAvisos.render($("app"));
  if (S.view === "pronto" && window.LYAPronto) return LYAPronto.render($("app"));
  if (S.view === "camara" && window.LYACamara) return LYACamara.render($("app"));
  if (S.view === "read" && R) return renderRead();
  if (S.view === "learn") return renderLearn();
  if (S.view === "hub" && window.LYANav) return LYANav.render($("app"));
  return renderHome();
}
let routeN = 0;
async function route() {
  const n = ++routeN; sel = null; Q = null; hideTip(0);
  let h = location.hash.slice(1);
  const old = h.match(/^lectura-(\d)$/); if (old) h = ["bear-a1", "bear-a2", "bear-b1"][+old[1] - 1] || "inicio";
  try { PK = await loadPack(S.learn, S.know); } catch (e) { $("app").innerHTML = `<p class="msg">${esc(U("load_error", "es"))}<br>${esc(U("load_error", "en"))}</p>`; return; }
  const lv = h.match(/^nivel-(a1|a2|b1|b2|c1)$/);
  if (h === "aprender" || h === "lecturas") S.view = "learn";
  else if (window.LYANav?.isHub(h)) S.view = "hub";
  else if (window.LYAMates?.isMates(h)) S.view = "mates";
  else if (window.LYAFpb?.isFpb(h)) S.view = "fpb";
  else if (h === "diccionario") S.view = "dict";
  else if (window.LYAFichas?.isFc(h)) S.view = "fc";
  else if (window.LYAJuegos?.isGames(h)) S.view = "games";
  else if (h === "progreso") S.view = "prog";
  else if (window.LYAMascota?.isPet(h)) S.view = "pet";
  else if (window.LYACanciones?.isSongs(h)) S.view = "songs";
  else if (window.LYADoblaje?.isDub(h)) S.view = "dub";
  else if (window.LYADictados?.isDict(h)) S.view = "dictado";
  else if (window.LYADuelo?.isDuelo(h)) S.view = "duelo";
  else if (window.LYAEscape?.isEscape(h)) S.view = "escape";
  else if (window.LYARetos?.isRetos(h)) S.view = "retos";
  else if (window.LYAConcursos?.isCc(h)) S.view = "cc";
  else if (window.LYAVideos?.isVd(h)) S.view = "vd";
  else if (window.LYAAvisos?.isDeb?.(h)) S.view = "deb";
  else if (window.LYAPronto?.isPronto(h)) S.view = "pronto";
  else if (window.LYACamara?.isCam(h)) S.view = "camara";
  else if (lv) { S.view = "learn"; S.level = lv[1].toUpperCase(); }
  else if (rdById(h)?.file) {
    const meta = rdById(h);
    if (R?.id !== h) { $("app").innerHTML = `<p class="msg">${TI("loading")}</p>`; try { R = await loadReading(meta.file); } catch (e) { $("app").innerHTML = `<p class="msg">${TI("load_error")}</p>`; return; } }
    if (n !== routeN) return;
    S.view = "read"; S.read = h; S.level = meta.level;
    checkReading(R);
  } else S.view = "home";
  save(); render();
}
addEventListener("hashchange", () => { route(); scrollTo(0, 0); });

async function start() {
  try { [CAT, UI] = await Promise.all([getJSON("content/catalogo.json"), getJSON("content/textos-web.json")]); }
  catch (e) { $("app").innerHTML = `<p class="msg">No se ha podido cargar el contenido. · The content could not be loaded.</p>`; return; }
  /* accounts (cuentas.js): a signed-in user gets the progress saved in the cloud; otherwise the local guest profile */
  if (window.LYACuentas) await LYACuentas.preparar(P, () => store.set(PKEY, P));
  if (!prof()) { const id = "local"; if (!P.list.some(p => p.id === id)) P.list.push({id, name: "", s: migrateOld() || fresh()}); P.cur = id; store.set(PKEY, P); }
  S = prof().s; fix(); fixG();
  for (const l in GTXT) UI[l] = {...GTXT[l], ...(UI[l] || {})};
  route();
  window.LYACuentas?.boton();
  window.LYAAvisos?.cargar();
}
/* bridge for voz.js (voice, karaoke, recording) */
window.LYA = window.LYA || {}; for (const [k, f] of Object.entries({S: () => S, R: () => R, CAT: () => CAT})) Object.defineProperty(window.LYA, k, {get: f, configurable: true}); Object.assign(window.LYA, {tok, plain, both, save});
window.LYA = Object.assign(window.LYA || {}, {award: (...a) => award(...a)});
{ const LYA = window.LYA = window.LYA || {}; const mine = {rdList, rdById, loadReading, setAcc, speak, NAME, both, save}; for (const k in mine) if (!(k in LYA)) LYA[k] = mine[k]; LYA.get = () => ({S, CAT, PK, R}); LYA.renderPage = render;
  /* nav/nav.js: idioma desde la barra superior y «＋ Al diccionario» desde el buscador */
  LYA.setLang = (act, l) => { if ((act === "know" || act === "learn") && CAT.languages[l]) { S[act] = l; fixCourse(act); save(); route(); } };
  LYA.addWord = d => { if (!d || !d.k || inDict(d.k, "buscar")) return false; S.dict.push({w: d.w, k: d.k, r: "buscar", l: S.learn, t: d.t || "", tr: {[S.know]: d.t || ""}, d: d.d || "", miss: false}); xp(1, "dict-save", {ok: true, word: d.w}); fillTr(); save(); renderTop(); if (S.view === "dict") render(); return true; }; } /* mini-juegos */
start();
}
