<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un volcán con lava" xmlns:c2pa="http://c2pa.org/manifest">
<defs><radialGradient id="g"><stop offset="0" stop-color="#2ec4a0" stop-opacity=".45"/><stop offset=".5" stop-color="#2ec4a0" stop-opacity=".12"/><stop offset="1" stop-color="#2ec4a0" stop-opacity="0"/></radialGradient>
<style>.glow{animation:p 5s ease-in-out infinite}@keyframes p{0%,100%{opacity:.7}50%{opacity:1}}
circle[fill="#f4eee6"][opacity=".5"]{animation:tw 5s ease-in-out infinite}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(2n){animation-delay:-1.7s}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(3n){animation-delay:-3.3s}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
.fb{transform-box:fill-box;transform-origin:center}
.smk circle{transform-box:fill-box;transform-origin:center;animation:smk 5s ease-out infinite}
.smk circle:nth-child(2){animation-delay:-1.66s}.smk circle:nth-child(3){animation-delay:-3.33s}
@keyframes smk{0%{transform:translateY(30px) scale(.5);opacity:0}20%{opacity:.95}100%{transform:translateY(-60px) scale(1.35);opacity:0}}
.lava{animation:lava 1.25s ease-in-out infinite alternate}
@keyframes lava{to{fill:#ffb347}}
.spk circle{animation:spk 5s ease-out infinite}.spk circle:nth-child(2){animation-delay:-2.5s}.spk circle:nth-child(3){animation-delay:-1.2s}.spk circle:nth-child(4){animation-delay:-3.7s}
@keyframes spk{0%{transform:translateY(60px);opacity:0}10%{opacity:1}60%,100%{transform:translateY(-40px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="1000" height="360" fill="#120e16"/><circle cx="90" cy="50" r="2" fill="#f4eee6" opacity=".5"/><circle cx="180" cy="120" r="1.5" fill="#f4eee6" opacity=".5"/><circle cx="260" cy="40" r="1.5" fill="#f4eee6" opacity=".5"/><circle cx="820" cy="60" r="2" fill="#f4eee6" opacity=".5"/><circle cx="900" cy="140" r="1.5" fill="#f4eee6" opacity=".5"/><circle cx="720" cy="30" r="1.5" fill="#f4eee6" opacity=".5"/><circle cx="140" cy="210" r="1" fill="#f4eee6" opacity=".5"/><circle cx="950" cy="230" r="1" fill="#f4eee6" opacity=".5"/><circle class="glow" cx="500" cy="190" r="260" fill="url(#g)"/><path d="M0 300 Q500 270 1000 300 V360 H0Z" fill="#1b1523"/><path d="M0 312 Q500 286 1000 312" stroke="#2ec4a0" stroke-opacity=".25" stroke-width="2" fill="none"/><path d="M260 310 L440 120 H560 L740 310Z" fill="#3a2f45"/><path class="lava" d="M440 120 H560 L590 150 C560 140 540 170 500 160 C470 175 440 140 410 152Z" fill="#ff6a3d"/>
<path class="lava" style="animation-delay:-.6s" d="M480 160 C470 200 500 230 470 300 H510 C530 240 500 210 515 160Z" fill="#ff6a3d"/>
<g class="smk" fill="#4b4258" opacity=".9"><circle cx="470" cy="90" r="30"/><circle cx="520" cy="70" r="38"/><circle cx="570" cy="50" r="28"/></g>
<g fill="#2ec4a0"><path d="M200 310 l40 -110 l40 110z"/><path d="M760 310 l40 -90 l40 90z"/><path d="M830 310 l30 -70 l30 70z"/></g>
<g class="spk"><circle cx="440" cy="60" r="6" fill="#ffcf33"/><circle cx="590" cy="100" r="5" fill="#ffcf33"/><circle cx="510" cy="90" r="4" fill="#ff6a3d"/><circle cx="470" cy="100" r="4" fill="#ffcf33"/></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>