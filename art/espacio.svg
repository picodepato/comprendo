<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un planeta con anillos y un cohete" xmlns:c2pa="http://c2pa.org/manifest">
<defs><radialGradient id="g"><stop offset="0" stop-color="#7b7bff" stop-opacity=".45"/><stop offset=".5" stop-color="#7b7bff" stop-opacity=".12"/><stop offset="1" stop-color="#7b7bff" stop-opacity="0"/></radialGradient>
<style>.glow{animation:p 5s ease-in-out infinite}@keyframes p{0%,100%{opacity:.7}50%{opacity:1}}
circle[fill="#f4eee6"][opacity=".5"]{animation:tw 5s ease-in-out infinite}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(2n){animation-delay:-1.7s}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(3n){animation-delay:-3.3s}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
.fb{transform-box:fill-box;transform-origin:center}
.rk{animation:rk 5s ease-in-out infinite}
@keyframes rk{0%,100%{transform:none}25%{transform:translate(18px,-14px)}50%{transform:translate(0,-26px)}75%{transform:translate(-16px,-10px)}}
.fl{transform-box:fill-box;transform-origin:50% 0;animation:fl .25s ease-in-out infinite alternate}
@keyframes fl{to{transform:scaleY(.6)}}
.pl{transform-origin:460px 190px;animation:pl 5s ease-in-out infinite}
@keyframes pl{0%,100%{transform:none}50%{transform:translateY(6px) rotate(2deg)}}
.ss{animation:ss 5s ease-in infinite}
@keyframes ss{0%,62%{opacity:0;transform:none}66%{opacity:1}80%,100%{opacity:0;transform:translate(-320px,120px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="1000" height="360" fill="#120e16"/><circle cx="90" cy="50" r="2" fill="#f4eee6" opacity=".5"/><circle cx="180" cy="120" r="1.5" fill="#f4eee6" opacity=".5"/><circle cx="260" cy="40" r="1.5" fill="#f4eee6" opacity=".5"/><circle cx="820" cy="60" r="2" fill="#f4eee6" opacity=".5"/><circle cx="900" cy="140" r="1.5" fill="#f4eee6" opacity=".5"/><circle cx="720" cy="30" r="1.5" fill="#f4eee6" opacity=".5"/><circle cx="140" cy="210" r="1" fill="#f4eee6" opacity=".5"/><circle cx="950" cy="230" r="1" fill="#f4eee6" opacity=".5"/><circle class="glow" cx="500" cy="190" r="260" fill="url(#g)"/><g class="pl"><circle cx="460" cy="190" r="100" fill="#7b7bff"/><path d="M380 130 a100 100 0 0 1 150 -20 a90 90 0 0 0 -150 20z" fill="#b0b0ff"/>
<ellipse cx="460" cy="190" rx="190" ry="40" fill="none" stroke="#ffcf33" stroke-width="12" transform="rotate(-14 460 190)"/>
<path d="M360 160 a100 100 0 0 1 200 0" fill="#7b7bff" transform="rotate(-14 460 190)"/>
<circle cx="420" cy="215" r="14" fill="#5a5ad6"/><circle cx="500" cy="235" r="9" fill="#5a5ad6"/></g>
<g class="rk"><g transform="translate(720 120) rotate(35)"><path d="M0 -60 C24 -30 24 20 18 40 H-18 C-24 20 -24 -30 0 -60Z" fill="#f4eee6"/><circle cy="-10" r="10" fill="#7b7bff"/><path d="M-18 20 l-16 26 h16z M18 20 l16 26 h-16z" fill="#ff4141"/><path class="fl" d="M-10 42 L0 80 L10 42z" fill="#ffcf33"/></g></g><path class="ss" d="M900 30 l-60 22" stroke="#fff1c9" stroke-width="3" stroke-linecap="round"/><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>