<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Una pitaya abierta y un insecto" xmlns:c2pa="http://c2pa.org/manifest">
<defs><radialGradient id="g"><stop offset="0" stop-color="#c45cff" stop-opacity=".45"/><stop offset=".5" stop-color="#c45cff" stop-opacity=".12"/><stop offset="1" stop-color="#c45cff" stop-opacity="0"/></radialGradient>
<style>.glow{animation:p 5s ease-in-out infinite}@keyframes p{0%,100%{opacity:.7}50%{opacity:1}}
circle[fill="#f4eee6"][opacity=".5"]{animation:tw 5s ease-in-out infinite}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(2n){animation-delay:-1.7s}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(3n){animation-delay:-3.3s}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
.fb{transform-box:fill-box;transform-origin:center}
.bug{animation:bug 5s ease-in-out infinite}
@keyframes bug{0%,100%{transform:none}20%{transform:translate(-22px,-3px)}25%{transform:translate(-26px,0)}45%{transform:translate(-48px,-3px)}50%{transform:translate(-52px,0)}75%{transform:translate(-20px,-2px)}}
.half{transform-origin:580px 310px;animation:half 5s ease-in-out infinite}
@keyframes half{0%,100%{transform:none}25%{transform:rotate(2.5deg)}75%{transform:rotate(-2deg)}}
.whole{transform-origin:420px 300px;animation:half 5s ease-in-out -2.5s infinite}
.sd circle{animation:sd 5s ease-in-out infinite}.sd circle:nth-child(odd){animation-delay:-2.5s}
@keyframes sd{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
