.st{animation:st 5s infinite}@keyframes st{0%,55%,100%{opacity:.5}58%{opacity:1}}
.flash{opacity:0;animation:flash 5s infinite}
@keyframes flash{0%,55%{opacity:0}58%{opacity:.35}70%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
