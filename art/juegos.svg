<defs><radialGradient id="g"><stop offset="0" stop-color="#4d9dff" stop-opacity=".45"/><stop offset=".5" stop-color="#4d9dff" stop-opacity=".12"/><stop offset="1" stop-color="#4d9dff" stop-opacity="0"/></radialGradient>
<style>.glow{animation:p 5s ease-in-out infinite}@keyframes p{0%,100%{opacity:.7}50%{opacity:1}}
