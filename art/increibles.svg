<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un ajolote rosa" xmlns:c2pa="http://c2pa.org/manifest">
<defs><radialGradient id="g"><stop offset="0" stop-color="#ff9ccf" stop-opacity=".45"/><stop offset=".5" stop-color="#ff9ccf" stop-opacity=".12"/><stop offset="1" stop-color="#ff9ccf" stop-opacity="0"/></radialGradient>
<style>.glow{animation:p 5s ease-in-out infinite}@keyframes p{0%,100%{opacity:.7}50%{opacity:1}}
circle[fill="#f4eee6"][opacity=".5"]{animation:tw 5s ease-in-out infinite}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(2n){animation-delay:-1.7s}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(3n){animation-delay:-3.3s}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
.fb{transform-box:fill-box;transform-origin:center}
.gl{animation:gl 5s ease-in-out infinite}.gr{animation:gr 5s ease-in-out infinite}
@keyframes gl{0%,100%{transform:none}50%{transform:rotate(-9deg)}}
@keyframes gr{0%,100%{transform:none}50%{transform:rotate(9deg)}}
.tail{transform-origin:600px 270px;animation:tail 2.5s ease-in-out infinite}
@keyframes tail{0%,100%{transform:none}50%{transform:rotate(-7deg)}}
.eyes{transform-origin:460px 190px;animation:bl 5s infinite}
@keyframes bl{0%,44%,50%,100%{transform:none}47%{transform:scaleY(.1)}}
.hd{transform-origin:460px 260px;animation:hd 5s ease-in-out infinite}
@keyframes hd{0%,100%{transform:none}50%{transform:rotate(-2.5deg) translateY(-3px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
