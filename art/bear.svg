<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un oso con luz roja en una puerta oscura" xmlns:c2pa="http://c2pa.org/manifest">
    <defs><style>.glow{animation:p 5s ease-in-out infinite}@keyframes p{0%,100%{opacity:.7}50%{opacity:1}}
