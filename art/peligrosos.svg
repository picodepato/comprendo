<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Una serpiente naranja" xmlns:c2pa="http://c2pa.org/manifest">
<defs><radialGradient id="g"><stop offset="0" stop-color="#ff8c1a" stop-opacity=".45"/><stop offset=".5" stop-color="#ff8c1a" stop-opacity=".12"/><stop offset="1" stop-color="#ff8c1a" stop-opacity="0"/></radialGradient>
<style>.glow{animation:p 5s ease-in-out infinite}@keyframes p{0%,100%{opacity:.7}50%{opacity:1}}
circle[fill="#f4eee6"][opacity=".5"]{animation:tw 5s ease-in-out infinite}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(2n){animation-delay:-1.7s}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(3n){animation-delay:-3.3s}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
.fb{transform-box:fill-box;transform-origin:center}
.scale{animation:scl 5s linear infinite}@keyframes scl{to{stroke-dashoffset:-60}}
.hd{transform-origin:520px 140px;animation:hd 5s ease-in-out infinite}
@keyframes hd{0%,100%{transform:none}30%{transform:rotate(-5deg) translateY(-6px)}60%{transform:rotate(3deg)}}
.tg{transform-origin:596px 118px;animation:tg 5s infinite}
@keyframes tg{0%,30%,40%,48%,100%{transform:scaleX(0)}33%,37%,43%{transform:scaleX(1)}}
.eye2{transform-origin:560px 100px;animation:e 5s infinite}@keyframes e{0%,70%,76%,100%{transform:none}73%{transform:scaleY(.15)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
