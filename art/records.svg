<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un trofeo con una estrella" xmlns:c2pa="http://c2pa.org/manifest">
<defs><radialGradient id="g"><stop offset="0" stop-color="#ffcf33" stop-opacity=".45"/><stop offset=".5" stop-color="#ffcf33" stop-opacity=".12"/><stop offset="1" stop-color="#ffcf33" stop-opacity="0"/></radialGradient>
<style>.glow{animation:p 5s ease-in-out infinite}@keyframes p{0%,100%{opacity:.7}50%{opacity:1}}
circle[fill="#f4eee6"][opacity=".5"]{animation:tw 5s ease-in-out infinite}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(2n){animation-delay:-1.7s}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(3n){animation-delay:-3.3s}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
.fb{transform-box:fill-box;transform-origin:center}
.tr{transform-origin:500px 302px;animation:tr 5s ease-in-out infinite}
@keyframes tr{0%,100%{transform:none}10%{transform:scale(1.04,.96)}20%{transform:translateY(-14px)}30%{transform:none}}
.shine{animation:sh 5s ease-in-out infinite}@keyframes sh{0%,100%{opacity:.2}25%{opacity:1}}
.sp{transform-box:fill-box;transform-origin:center;animation:sp 5s ease-in-out infinite;opacity:0}
.sp:nth-of-type(2){animation-delay:-1.6s}.sp:nth-of-type(3){animation-delay:-3.3s}
@keyframes sp{0%,100%{transform:scale(0) rotate(0);opacity:0}25%{transform:scale(1) rotate(45deg);opacity:1}45%{transform:scale(0) rotate(90deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
