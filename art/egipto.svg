<g stroke="#b38a45" stroke-width="3" opacity=".7"><path d="M425 190 H535"/><path d="M395 230 H565"/><path d="M365 268 H595"/></g><g class="dust" fill="#e8c07a"><circle cx="820" cy="285" r="3"/><circle cx="760" cy="270" r="2"/><circle cx="880" cy="292" r="2.5"/></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>