<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Pirámides bajo el sol" xmlns:c2pa="http://c2pa.org/manifest">
<defs><radialGradient id="g"><stop offset="0" stop-color="#e8c07a" stop-opacity=".45"/><stop offset=".5" stop-color="#e8c07a" stop-opacity=".12"/><stop offset="1" stop-color="#e8c07a" stop-opacity="0"/></radialGradient>
<style>.glow{animation:p 5s ease-in-out infinite}@keyframes p{0%,100%{opacity:.7}50%{opacity:1}}
circle[fill="#f4eee6"][opacity=".5"]{animation:tw 5s ease-in-out infinite}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(2n){animation-delay:-1.7s}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(3n){animation-delay:-3.3s}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
.fb{transform-box:fill-box;transform-origin:center}
.sun{transform-origin:680px 110px;animation:sun 5s ease-in-out infinite}
@keyframes sun{0%,100%{transform:none}50%{transform:translateY(-8px) scale(1.04)}}
.ring{transform-origin:680px 110px;animation:ring 5s ease-out infinite}.ring2{animation-delay:-2.5s}
@keyframes ring{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(1.9);opacity:0}}
.dust circle{animation:dust 5s linear infinite}.dust circle:nth-child(2){animation-delay:-1.7s}.dust circle:nth-child(3){animation-delay:-3.4s}
@keyframes dust{0%{transform:translateX(0);opacity:0}15%{opacity:.8}85%{opacity:.8}100%{transform:translateX(-260px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
