<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un monopatín saltando en una rampa" xmlns:c2pa="http://c2pa.org/manifest">
<defs><radialGradient id="g"><stop offset="0" stop-color="#ff4fa0" stop-opacity=".45"/><stop offset=".5" stop-color="#ff4fa0" stop-opacity=".12"/><stop offset="1" stop-color="#ff4fa0" stop-opacity="0"/></radialGradient>
<style>.glow{animation:p 5s ease-in-out infinite}@keyframes p{0%,100%{opacity:.7}50%{opacity:1}}
circle[fill="#f4eee6"][opacity=".5"]{animation:tw 5s ease-in-out infinite}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(2n){animation-delay:-1.7s}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(3n){animation-delay:-3.3s}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
.fb{transform-box:fill-box;transform-origin:center}
.sk{transform-origin:500px 120px;animation:sk 5s cubic-bezier(.4,0,.3,1) infinite}
@keyframes sk{0%,12%{transform:none}30%{transform:translateY(-60px) rotate(180deg)}48%{transform:translateY(0) rotate(360deg)}52%{transform:translateY(4px) rotate(360deg)}58%,100%{transform:translateY(0) rotate(360deg)}}
.ln{animation:ln 5s ease-in-out infinite}@keyframes ln{0%,100%{opacity:.4;transform:none}50%{opacity:1;transform:translate(-14px,10px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="1000" height="360" fill="#120e16"/><circle cx="90" cy="50" r="2" fill="#f4eee6" opacity=".5"/><circle cx="180" cy="120" r="1.5" fill="#f4eee6" opacity=".5"/><circle cx="260" cy="40" r="1.5" fill="#f4eee6" opacity=".5"/><circle cx="820" cy="60" r="2" fill="#f4eee6" opacity=".5"/><circle cx="900" cy="140" r="1.5" fill="#f4eee6" opacity=".5"/><circle cx="720" cy="30" r="1.5" fill="#f4eee6" opacity=".5"/><circle cx="140" cy="210" r="1" fill="#f4eee6" opacity=".5"/><circle cx="950" cy="230" r="1" fill="#f4eee6" opacity=".5"/><circle class="glow" cx="500" cy="190" r="260" fill="url(#g)"/><path d="M0 300 Q500 270 1000 300 V360 H0Z" fill="#1b1523"/><path d="M0 312 Q500 286 1000 312" stroke="#ff4fa0" stroke-opacity=".25" stroke-width="2" fill="none"/><path d="M180 300 C320 300 350 180 360 120 H390 V300Z" fill="#2b2236"/><path d="M820 300 C680 300 650 180 640 120 H610 V300Z" fill="#2b2236"/>
<path d="M180 300 C320 300 350 180 360 120 M820 300 C680 300 650 180 640 120" stroke="#ff4fa0" stroke-width="6" fill="none"/>
<g class="sk"><g transform="translate(500 120) rotate(-18)"><rect x="-90" y="-10" width="180" height="20" rx="10" fill="#ff4fa0"/><circle cx="-55" cy="20" r="14" fill="#f4eee6"/><circle cx="55" cy="20" r="14" fill="#f4eee6"/></g></g>
<g class="ln" stroke="#ff4fa0" stroke-opacity=".5" stroke-width="6" stroke-linecap="round"><path d="M360 200 q40 -60 90 -70"/><path d="M380 220 q40 -50 80 -60"/></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>