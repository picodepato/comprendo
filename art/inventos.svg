<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Una bombilla y un engranaje" xmlns:c2pa="http://c2pa.org/manifest">
<defs><radialGradient id="g"><stop offset="0" stop-color="#b5f04a" stop-opacity=".45"/><stop offset=".5" stop-color="#b5f04a" stop-opacity=".12"/><stop offset="1" stop-color="#b5f04a" stop-opacity="0"/></radialGradient>
<style>.glow{animation:p 5s ease-in-out infinite}@keyframes p{0%,100%{opacity:.7}50%{opacity:1}}
circle[fill="#f4eee6"][opacity=".5"]{animation:tw 5s ease-in-out infinite}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(2n){animation-delay:-1.7s}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(3n){animation-delay:-3.3s}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
.fb{transform-box:fill-box;transform-origin:center}
.gear{transform-origin:640px 230px;animation:gear 5s linear infinite}
@keyframes gear{to{transform:rotate(360deg)}}
.bulb{animation:bulb 5s ease-in-out infinite}
@keyframes bulb{0%,100%{fill:#b5f04a}8%{fill:#6f8f2a}12%{fill:#e9ffb0}50%{fill:#d4ff7a}}
.rays{transform-origin:480px 150px;animation:rays 5s ease-in-out infinite}
@keyframes rays{0%,100%{opacity:.3;transform:none}12%,60%{opacity:1;transform:scale(1.08)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
