<g class="rip" stroke="#a9bdd4" stroke-opacity=".5" stroke-width="3" fill="none"><path d="M300 250 q30 8 60 0 q30 -8 60 0"/><path d="M520 252 q40 8 80 0"/></g>
<g class="fog" fill="#a9bdd4" opacity=".22"><rect x="80" y="200" width="380" height="22" rx="11"/><rect x="560" y="262" width="360" height="20" rx="10"/><rect x="200" y="290" width="300" height="18" rx="9"/></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>