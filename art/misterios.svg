<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un monstruo en un lago con niebla" xmlns:c2pa="http://c2pa.org/manifest">
<defs><clipPath id="lago"><rect width="1000" height="241"/></clipPath><radialGradient id="g"><stop offset="0" stop-color="#a9bdd4" stop-opacity=".45"/><stop offset=".5" stop-color="#a9bdd4" stop-opacity=".12"/><stop offset="1" stop-color="#a9bdd4" stop-opacity="0"/></radialGradient>
<style>.glow{animation:p 5s ease-in-out infinite}@keyframes p{0%,100%{opacity:.7}50%{opacity:1}}
circle[fill="#f4eee6"][opacity=".5"]{animation:tw 5s ease-in-out infinite}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(2n){animation-delay:-1.7s}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(3n){animation-delay:-3.3s}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
.fb{transform-box:fill-box;transform-origin:center}
.nes{animation:nes 5s ease-in-out infinite}
@keyframes nes{0%,8%{transform:translateY(150px)}35%,65%{transform:translateY(0)}92%,100%{transform:translateY(150px)}}
.neck{transform-origin:565px 240px;animation:neck 5s ease-in-out infinite}
@keyframes neck{0%,40%{transform:none}50%{transform:rotate(-5deg)}60%,100%{transform:none}}
.fog rect{animation:fog 5s ease-in-out infinite}.fog rect:nth-child(2){animation-direction:reverse}
@keyframes fog{0%,100%{transform:none}50%{transform:translateX(40px)}}
.rip{animation:rip 5s ease-in-out infinite}@keyframes rip{0%,100%{opacity:.2}30%,70%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="1000" height="360" fill="#120e16"/><circle cx="90" cy="50" r="2" fill="#f4eee6" opacity=".5"/><circle cx="180" cy="120" r="1.5" fill="#f4eee6" opacity=".5"/><circle cx="260" cy="40" r="1.5" fill="#f4eee6" opacity=".5"/><circle cx="820" cy="60" r="2" fill="#f4eee6" opacity=".5"/><circle cx="900" cy="140" r="1.5" fill="#f4eee6" opacity=".5"/><circle cx="720" cy="30" r="1.5" fill="#f4eee6" opacity=".5"/><circle cx="140" cy="210" r="1" fill="#f4eee6" opacity=".5"/><circle cx="950" cy="230" r="1" fill="#f4eee6" opacity=".5"/><circle class="glow" cx="500" cy="190" r="260" fill="url(#g)"/><circle cx="760" cy="80" r="40" fill="#f4eee6" opacity=".85"/>
<path d="M0 230 H1000 V360 H0Z" fill="#16202b"/>
