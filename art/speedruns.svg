<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un cronómetro" xmlns:c2pa="http://c2pa.org/manifest">
<defs><radialGradient id="g"><stop offset="0" stop-color="#23d5e0" stop-opacity=".45"/><stop offset=".5" stop-color="#23d5e0" stop-opacity=".12"/><stop offset="1" stop-color="#23d5e0" stop-opacity="0"/></radialGradient>
<style>.glow{animation:p 5s ease-in-out infinite}@keyframes p{0%,100%{opacity:.7}50%{opacity:1}}
circle[fill="#f4eee6"][opacity=".5"]{animation:tw 5s ease-in-out infinite}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(2n){animation-delay:-1.7s}
circle[fill="#f4eee6"][opacity=".5"]:nth-of-type(3n){animation-delay:-3.3s}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
.fb{transform-box:fill-box;transform-origin:center}
.hs{transform-origin:520px 190px;animation:spin 1.25s linear infinite}
.hm{transform-origin:520px 190px;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btp{animation:btp 5s infinite}@keyframes btp{0%,8%,100%{transform:none}3%{transform:translateY(7px)}}
.sl{animation:sl .625s linear infinite}@keyframes sl{0%{transform:translateX(30px);opacity:0}30%{opacity:.9}100%{transform:translateX(-60px);opacity:0}}
.sl path:nth-child(2){animation:sl .625s linear -.2s infinite}.sl path:nth-child(3){animation:sl .625s linear -.4s infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
