.lt{animation:lt 5s steps(1) infinite}.lt2{animation:lt 5s steps(1) -2.2s infinite}
@keyframes lt{0%,100%{opacity:1}30%{opacity:.25}34%{opacity:1}52%{opacity:.4}54%{opacity:1}}
